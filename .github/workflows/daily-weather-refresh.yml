name: Daily Weather Refresh

on:
  schedule:
    - cron: "30 19 * * *"
    - cron: "30 0 * * *"
    - cron: "30 1 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refresh current weather and forecasts
        env:
          WEATHER_API_BASE_URL: ${{ vars.WEATHER_API_BASE_URL }}
          WEATHERIQ_API_KEY: ${{ secrets.WEATHERIQ_API_KEY }}
        run: |
          if [ -z "$WEATHER_API_BASE_URL" ]; then
            echo "::error::Set the WEATHER_API_BASE_URL repository variable first."
            exit 1
          fi
          if [ -z "$WEATHERIQ_API_KEY" ]; then
            echo "::error::Set the WEATHERIQ_API_KEY repository secret first."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import urllib.error
          import urllib.request

          base_url = os.environ["WEATHER_API_BASE_URL"].rstrip("/")
          headers = {
              "Accept": "application/json",
              "Content-Type": "application/json",
              "X-API-Key": os.environ["WEATHERIQ_API_KEY"],
          }

          def request_json(url, *, data=None):
              request = urllib.request.Request(url, data=data, headers=headers, method="POST" if data else "GET")
              with urllib.request.urlopen(request, timeout=180) as response:
                  return json.load(response)

          def refreshed_today_after_six(location, payload):
              zone = ZoneInfo(location.get("timezone") or "UTC")
              local_now = datetime.now(zone)
              cutoff = local_now.replace(hour=6, minute=0, second=0, microsecond=0)
              freshness = payload.get("freshness") or {}
              today_forecast = payload.get("today_forecast") or {}
              timestamps = [freshness.get("retrieved_at"), today_forecast.get("retrieved_at")]
              if not all(isinstance(value, str) for value in timestamps):
                  return False
              try:
                  retrieved = [
                      datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(zone)
                      for value in timestamps
                  ]
              except ValueError:
                  return False
              return all(
                  value.date() == local_now.date() and value >= cutoff
                  for value in retrieved
              )

          try:
              locations = request_json(f"{base_url}/locations").get("items")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Could not list locations (HTTP {error.code}): {body}") from error
          except (urllib.error.URLError, TimeoutError) as error:
              raise SystemExit(f"Could not reach the weather API to list locations: {error}") from error

          if not isinstance(locations, list) or not locations:
              raise SystemExit("The weather API returned no configured locations.")

          failures = []
          for location in locations:
              location_id = location["id"]
              rate_limited = False
              try:
                  if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
                      try:
                          current = request_json(
                              f"{base_url}/weather/current?location_id={location_id}"
                          )
                          if refreshed_today_after_six(location, current):
                              print(
                                  f"Skipping {location.get('name', location_id)}: "
                                  "current weather and forecast were already refreshed after 06:00 local time."
                              )
                              continue
                      except (urllib.error.URLError, TimeoutError, ValueError) as error:
                          print(
                              f"::warning::Could not check the latest snapshot for "
                              f"{location.get('name', location_id)}; attempting refresh: {error}"
                          )
                  result = request_json(
                      f"{base_url}/ingestion/run",
                      data=json.dumps(
                          {"location_id": location_id, "kinds": ["current", "forecast"]}
                      ).encode(),
                  )
                  runs = result.get("runs")
                  if not isinstance(runs, list):
                      raise ValueError(f"Unexpected API response: {result}")
                  for run in runs:
                      for kind, details in run.get("kinds", {}).items():
                          if isinstance(details, dict) and "error" in details:
                              failures.append((location_id, kind, details["error"]))
                              rate_limited = rate_limited or "HTTP 429" in details["error"]
                  print(f"Processed {location.get('name', location_id)}: {json.dumps(result)}")
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  failures.append((location_id, "request", f"HTTP {error.code}: {body}"))
                  rate_limited = error.code == 429
              except (urllib.error.URLError, TimeoutError, ValueError) as error:
                  failures.append((location_id, "request", str(error)))
              if rate_limited:
                  print("::warning::Weather provider rate limit reached; stopping to avoid retrying every remaining city.")
                  break
              time.sleep(2)

          if failures:
              for location_id, kind, message in failures:
                  print(f"::error::Location {location_id} {kind} refresh failed: {message}")
              raise SystemExit(1)
          PY
