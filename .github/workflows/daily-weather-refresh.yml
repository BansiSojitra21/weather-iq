name: Daily Weather Refresh

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refresh current weather and forecasts
        env:
          WEATHER_API_BASE_URL: ${{ vars.WEATHER_API_BASE_URL }}
          WEATHERIQ_API_KEY: ${{ secrets.WEATHERIQ_API_KEY }}
        run: |
          if [ -z "$WEATHER_API_BASE_URL" ]; then
            echo "::error::Set the WEATHER_API_BASE_URL repository variable first."
            exit 1
          fi
          if [ -z "$WEATHERIQ_API_KEY" ]; then
            echo "::error::Set the WEATHERIQ_API_KEY repository secret first."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base_url = os.environ["WEATHER_API_BASE_URL"].rstrip("/")
          headers = {
              "Accept": "application/json",
              "Content-Type": "application/json",
              "X-API-Key": os.environ["WEATHERIQ_API_KEY"],
          }

          def request_json(url, *, data=None):
              request = urllib.request.Request(url, data=data, headers=headers, method="POST" if data else "GET")
              with urllib.request.urlopen(request, timeout=180) as response:
                  return json.load(response)

          try:
              locations = request_json(f"{base_url}/locations").get("items")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Could not list locations (HTTP {error.code}): {body}") from error
          except (urllib.error.URLError, TimeoutError) as error:
              raise SystemExit(f"Could not reach the weather API to list locations: {error}") from error

          if not isinstance(locations, list) or not locations:
              raise SystemExit("The weather API returned no configured locations.")

          failures = []
          for location in locations:
              location_id = location["id"]
              try:
                  result = request_json(
                      f"{base_url}/ingestion/run",
                      data=json.dumps(
                          {"location_id": location_id, "kinds": ["current", "forecast"]}
                      ).encode(),
                  )
                  runs = result.get("runs")
                  if not isinstance(runs, list):
                      raise ValueError(f"Unexpected API response: {result}")
                  for run in runs:
                      for kind, details in run.get("kinds", {}).items():
                          if isinstance(details, dict) and "error" in details:
                              failures.append((location_id, kind, details["error"]))
                  print(f"Refreshed {location.get('name', location_id)}: {json.dumps(result)}")
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  failures.append((location_id, "request", f"HTTP {error.code}: {body}"))
              except (urllib.error.URLError, TimeoutError, ValueError) as error:
                  failures.append((location_id, "request", str(error)))

          if failures:
              for location_id, kind, message in failures:
                  print(f"::error::Location {location_id} {kind} refresh failed: {message}")
              raise SystemExit(1)
          PY
